<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoxRoom — Salon Vocal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #090b10;
    --surface:   #0f1320;
    --card:      #151b2e;
    --border:    #1e2a45;
    --accent:    #4f8cff;
    --accent2:   #00e5b0;
    --danger:    #ff4d6d;
    --muted:     #64748b;
    --text:      #e2e8f0;
    --text-dim:  #94a3b8;
    --speaking:  #00e5b0;
    --radius:    14px;
    --glow:      0 0 24px rgba(79,140,255,.25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── Fond animé ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(79,140,255,.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(0,229,176,.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Grille de points ── */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  /* ══════════════ ÉCRAN DE CONNEXION ══════════════ */
  #join-screen {
    position: relative; z-index: 10;
    width: 100%; max-width: 440px;
    padding: 20px;
    animation: fadeUp .5s ease both;
  }

  .logo {
    text-align: center;
    margin-bottom: 40px;
  }
  .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin-bottom: 14px;
    box-shadow: var(--glow);
  }
  .logo h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo p {
    color: var(--text-dim);
    font-size: .85rem;
    margin-top: 4px;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,140,255,.15);
  }
  .field input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6ea3ff);
    color: #fff;
    box-shadow: 0 4px 20px rgba(79,140,255,.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(79,140,255,.45); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* ══════════════ ÉCRAN DU SALON ══════════════ */
  #room-screen {
    display: none;
    position: relative; z-index: 10;
    width: 100%; max-width: 860px;
    height: 100vh;
    padding: 24px;
    flex-direction: column;
    gap: 20px;
    animation: fadeUp .4s ease both;
  }
  #room-screen.active { display: flex; }

  .room-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
  }
  .room-name-wrap { display: flex; align-items: center; gap: 12px; }
  .room-hash {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent2);
    font-size: 1.1rem;
  }
  .room-title { font-weight: 600; font-size: 1rem; }
  .room-count {
    font-size: .78rem;
    color: var(--text-dim);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .live-dot {
    width: 8px; height: 8px;
    background: var(--accent2);
    border-radius: 50%;
    animation: pulse 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }

  /* Grille des participants */
  .participants-title {
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 4px;
  }

  #participants {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    align-content: start;
    overflow-y: auto;
    padding: 4px;
  }
  #participants::-webkit-scrollbar { width: 4px; }
  #participants::-webkit-scrollbar-track { background: transparent; }
  #participants::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .user-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: border-color .25s, box-shadow .25s;
    animation: cardIn .3s ease both;
  }
  .user-card.speaking {
    border-color: var(--speaking);
    box-shadow: 0 0 0 2px rgba(0,229,176,.15), 0 0 20px rgba(0,229,176,.1);
  }
  .user-card.me { border-color: var(--accent); }

  .avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 1.2rem;
    position: relative;
  }
  .avatar-ring {
    position: absolute; inset: -3px;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color .25s;
  }
  .user-card.speaking .avatar-ring { border-color: var(--speaking); animation: ringPulse 1s ease-in-out infinite; }

  .user-name {
    font-size: .85rem;
    font-weight: 600;
    text-align: center;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .user-badge {
    font-size: .65rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: .05em;
  }
  .badge-me { background: rgba(79,140,255,.15); color: var(--accent); }
  .badge-muted { background: rgba(255,77,109,.12); color: var(--danger); }

  /* Waveform */
  .waveform {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 18px;
  }
  .wave-bar {
    width: 3px;
    background: var(--speaking);
    border-radius: 2px;
    height: 4px;
    transition: height .1s;
  }
  .user-card.speaking .wave-bar:nth-child(1) { animation: wave 0.8s ease-in-out infinite; }
  .user-card.speaking .wave-bar:nth-child(2) { animation: wave 0.8s ease-in-out .1s infinite; }
  .user-card.speaking .wave-bar:nth-child(3) { animation: wave 0.8s ease-in-out .2s infinite; }
  .user-card.speaking .wave-bar:nth-child(4) { animation: wave 0.8s ease-in-out .15s infinite; }
  .user-card.speaking .wave-bar:nth-child(5) { animation: wave 0.8s ease-in-out .05s infinite; }

  /* Barre de contrôles */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .ctrl-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .ctrl-btn:hover { background: var(--border); transform: scale(1.05); }
  .ctrl-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ctrl-btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .ctrl-btn.danger:hover { filter: brightness(1.1); }

  .status-text {
    font-size: .8rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ══════════════ TOAST ══════════════ */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 50px;
    font-size: .85rem;
    color: var(--text-dim);
    transition: transform .3s ease;
    z-index: 999;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ══════════════ ANIMATIONS ══════════════ */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .3; }
  }
  @keyframes wave {
    0%, 100% { height: 4px; }
    50%       { height: 16px; }
  }
  @keyframes ringPulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .5; }
  }

  /* ══════════════ RESPONSIVE ══════════════ */
  @media (max-width: 500px) {
    #participants { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .room-title { font-size: .9rem; }
  }
</style>
</head>
<body>

<!-- ══════════════ ÉCRAN DE CONNEXION ══════════════ -->
<div id="join-screen">
  <div class="logo">
    <div class="logo-icon">🎙️</div>
    <h1>VoxRoom</h1>
    <p>Salon vocal en temps réel</p>
  </div>
  <div class="form-card">
    <div class="field">
      <label>Ton pseudo</label>
      <input id="input-username" type="text" placeholder="ex : Alice" maxlength="20" autocomplete="off" />
    </div>
    <div class="field">
      <label>Nom du salon</label>
      <input id="input-room" type="text" placeholder="ex : general" maxlength="20" autocomplete="off" />
    </div>
    <button class="btn btn-primary" id="join-btn" onclick="joinRoom()">
      Rejoindre le salon
    </button>
  </div>
</div>

<!-- ══════════════ ÉCRAN DU SALON ══════════════ -->
<div id="room-screen">
  <div class="room-header">
    <div class="room-name-wrap">
      <span class="room-hash">#</span>
      <span class="room-title" id="room-label">general</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="live-dot"></div>
      <span class="room-count" id="room-count">0 connecté(s)</span>
    </div>
  </div>

  <div class="participants-title">Participants</div>

  <div id="participants"></div>

  <div class="controls">
    <button class="ctrl-btn" id="mute-btn" title="Muet / Actif" onclick="toggleMute()">🎙️</button>
    <span class="status-text" id="status-label">connecté</span>
    <button class="ctrl-btn danger" title="Quitter" onclick="leaveRoom()">📴</button>
  </div>
</div>

<div id="toast"></div>

<!-- Socket.io + Script principal -->
<script src="/socket.io/socket.io.js"></script>
<script>
/* ══════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════ */
const ICE_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};

/* ══════════════════════════════════════════════
   ÉTAT GLOBAL
══════════════════════════════════════════════ */
let socket, localStream;
let myId = null, myUsername = '', myRoom = '';
let isMuted = false;
let peers = {};       // { socketId: RTCPeerConnection }
let users  = {};      // { socketId: { username, muted } }
let speakingTimers = {}; // pour détecter si on parle

/* ══════════════════════════════════════════════
   REJOINDRE LE SALON
══════════════════════════════════════════════ */
async function joinRoom() {
  const username = document.getElementById('input-username').value.trim();
  const room     = document.getElementById('input-room').value.trim() || 'general';

  if (!username) { showToast('Entre ton pseudo !'); return; }

  const btn = document.getElementById('join-btn');
  btn.disabled = true;
  btn.textContent = 'Connexion micro…';

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch(e) {
    showToast('❌ Accès micro refusé');
    btn.disabled = false;
    btn.textContent = 'Rejoindre le salon';
    return;
  }

  myUsername = username;
  myRoom     = room;

  setupAudioAnalyser();

  socket = io();
  setupSocket();

  socket.emit('join-room', { roomId: room, username });
}

/* ══════════════════════════════════════════════
   SOCKET.IO — SIGNALISATION
══════════════════════════════════════════════ */
function setupSocket() {
  socket.on('connect', () => {
    myId = socket.id;
    showRoomScreen();
  });

  /* Pairs déjà présents → on crée une offre pour chacun */
  socket.on('existing-peers', async (peers_list) => {
    for (const peer of peers_list) {
      users[peer.id] = { username: peer.username, muted: false };
      await createOffer(peer.id);
    }
  });

  /* Nouveau pair → il nous enverra une offre */
  socket.on('peer-joined', ({ id, username }) => {
    users[id] = { username, muted: false };
    showToast(`${username} a rejoint le salon`);
  });

  socket.on('offer', async ({ from, username, offer }) => {
    if (!users[from]) users[from] = { username, muted: false };
    const pc = getOrCreatePC(from);
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('answer', { to: from, answer });
  });

  socket.on('answer', async ({ from, answer }) => {
    const pc = peers[from];
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
  });

  socket.on('ice-candidate', async ({ from, candidate }) => {
    const pc = peers[from];
    if (pc && candidate) {
      try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) {}
    }
  });

  socket.on('peer-left', ({ id, username }) => {
    closePeer(id);
    delete users[id];
    showToast(`${username} a quitté le salon`);
  });

  socket.on('peer-mute', ({ id, muted }) => {
    if (users[id]) users[id].muted = muted;
    renderUsers();
  });

  socket.on('room-update', (list) => {
    document.getElementById('room-count').textContent = `${list.length} connecté(s)`;
    renderUsers();
  });
}

/* ══════════════════════════════════════════════
   WebRTC
══════════════════════════════════════════════ */
function getOrCreatePC(peerId) {
  if (peers[peerId]) return peers[peerId];

  const pc = new RTCPeerConnection(ICE_SERVERS);
  peers[peerId] = pc;

  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.onicecandidate = ({ candidate }) => {
    if (candidate) socket.emit('ice-candidate', { to: peerId, candidate });
  };

  pc.ontrack = ({ streams }) => {
    let audio = document.getElementById(`audio-${peerId}`);
    if (!audio) {
      audio = document.createElement('audio');
      audio.id = `audio-${peerId}`;
      audio.autoplay = true;
      document.body.appendChild(audio);
    }
    audio.srcObject = streams[0];

    /* Détection de parole sur le flux distant */
    detectSpeaking(streams[0], peerId);
  };

  pc.onconnectionstatechange = () => {
    if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
      closePeer(peerId);
    }
  };

  return pc;
}

async function createOffer(peerId) {
  const pc = getOrCreatePC(peerId);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('offer', { to: peerId, offer });
}

function closePeer(peerId) {
  if (peers[peerId]) { peers[peerId].close(); delete peers[peerId]; }
  const audio = document.getElementById(`audio-${peerId}`);
  if (audio) audio.remove();
  const card = document.getElementById(`card-${peerId}`);
  if (card) card.remove();
}

/* ══════════════════════════════════════════════
   DÉTECTION DE PAROLE (AudioContext)
══════════════════════════════════════════════ */
let audioCtx;

function setupAudioAnalyser() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  detectSpeaking(localStream, 'me');
}

function detectSpeaking(stream, id) {
  if (!audioCtx) return;
  try {
    const source   = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);

    function check() {
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      const speaking = avg > 8;
      const card = document.getElementById(`card-${id}`);
      if (card) card.classList.toggle('speaking', speaking && !(id === 'me' && isMuted));
      requestAnimationFrame(check);
    }
    check();
  } catch(e) {}
}

/* ══════════════════════════════════════════════
   CONTRÔLES
══════════════════════════════════════════════ */
function toggleMute() {
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  const btn = document.getElementById('mute-btn');
  btn.textContent  = isMuted ? '🔇' : '🎙️';
  btn.title        = isMuted ? 'Activer le micro' : 'Couper le micro';
  btn.classList.toggle('active', isMuted);
  document.getElementById('status-label').textContent = isMuted ? 'en sourdine' : 'connecté';
  if (socket) socket.emit('mute-state', { muted: isMuted });
  renderUsers();
}

function leaveRoom() {
  if (socket) socket.disconnect();
  Object.keys(peers).forEach(closePeer);
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  document.querySelectorAll('audio').forEach(a => a.remove());
  peers = {}; users = {}; myId = null;
  document.getElementById('room-screen').classList.remove('active');
  document.getElementById('join-screen').style.display = '';
  document.getElementById('participants').innerHTML = '';
  document.getElementById('join-btn').disabled = false;
  document.getElementById('join-btn').textContent = 'Rejoindre le salon';
  isMuted = false;
  document.getElementById('mute-btn').textContent = '🎙️';
}

/* ══════════════════════════════════════════════
   RENDU
══════════════════════════════════════════════ */
function showRoomScreen() {
  document.getElementById('join-screen').style.display = 'none';
  const rs = document.getElementById('room-screen');
  rs.classList.add('active');
  document.getElementById('room-label').textContent = myRoom;
  renderUsers();
}

function renderUsers() {
  const container = document.getElementById('participants');

  /* Carte "moi" */
  let myCard = document.getElementById('card-me');
  if (!myCard) {
    myCard = createCard('me', myUsername, true);
    container.prepend(myCard);
  }
  updateBadge(myCard, isMuted);

  /* Cartes pairs */
  const presentIds = new Set(['me']);
  Object.entries(users).forEach(([id, info]) => {
    presentIds.add(id);
    let card = document.getElementById(`card-${id}`);
    if (!card) {
      card = createCard(id, info.username, false);
      container.appendChild(card);
    }
    updateBadge(card, info.muted);
  });

  /* Supprimer les cartes obsolètes */
  container.querySelectorAll('.user-card').forEach(c => {
    if (!presentIds.has(c.id.replace('card-', ''))) c.remove();
  });
}

function createCard(id, username, isMe) {
  const colors = ['#4f8cff','#00e5b0','#f59e0b','#ec4899','#8b5cf6','#ef4444','#14b8a6'];
  const color  = colors[Math.abs(hashStr(username)) % colors.length];

  const div = document.createElement('div');
  div.id        = `card-${id}`;
  div.className = `user-card${isMe ? ' me' : ''}`;
  div.innerHTML = `
    <div class="avatar" style="background:${color}22;color:${color}">
      <div class="avatar-ring"></div>
      ${username.charAt(0).toUpperCase()}
    </div>
    <div class="user-name">${escHtml(username)}</div>
    <div class="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <span class="user-badge ${isMe ? 'badge-me' : ''}" id="badge-${id}">${isMe ? 'moi' : ''}</span>
  `;
  return div;
}

function updateBadge(card, muted) {
  const id    = card.id.replace('card-', '');
  const badge = document.getElementById(`badge-${id}`);
  if (!badge) return;
  const isMe  = id === 'me';
  if (muted) {
    badge.className = 'user-badge badge-muted';
    badge.textContent = '🔇 muet';
  } else {
    badge.className = `user-badge ${isMe ? 'badge-me' : ''}`;
    badge.textContent = isMe ? 'moi' : '';
  }
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return h;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Appuyer Entrée pour rejoindre */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('join-screen').style.display !== 'none') {
    joinRoom();
  }
});
</script>
