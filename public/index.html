<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VoxRoom — Salon Vocal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#090b10;--surface:#0f1320;--card:#151b2e;--border:#1e2a45;
  --accent:#4f8cff;--accent2:#00e5b0;--danger:#ff4d6d;
  --muted:#64748b;--text:#e2e8f0;--text-dim:#94a3b8;
  --speaking:#00e5b0;--radius:14px;--glow:0 0 24px rgba(79,140,255,.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%,rgba(79,140,255,.07) 0%,transparent 70%),
    radial-gradient(ellipse 50% 50% at 80% 80%,rgba(0,229,176,.05) 0%,transparent 70%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;
}

/* ══ JOIN SCREEN ══ */
#join-screen{
  position:relative;z-index:10;width:100%;max-width:440px;padding:20px;
  animation:fadeUp .5s ease both;
}
.logo{text-align:center;margin-bottom:36px;}
.logo-icon{
  width:56px;height:56px;border-radius:16px;display:inline-flex;
  align-items:center;justify-content:center;font-size:26px;margin-bottom:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:var(--glow);
}
.logo h1{
  font-size:1.8rem;font-weight:700;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff 40%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.logo p{color:var(--text-dim);font-size:.85rem;margin-top:4px;}

.form-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.field{margin-bottom:20px;}
.field label{
  display:block;font-size:.78rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;
}
.field input{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;color:var(--text);
  font-family:'Space Grotesk',sans-serif;font-size:.95rem;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15);}
.field input::placeholder{color:var(--muted);}

.btn{
  width:100%;padding:13px;border-radius:10px;border:none;
  font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#6ea3ff);color:#fff;
  box-shadow:0 4px 20px rgba(79,140,255,.3);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(79,140,255,.45);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* ══ ROOM SCREEN ══ */
#room-screen{
  display:none;position:relative;z-index:10;
  width:100vw;height:100vh;
  padding:16px;gap:14px;
}
#room-screen.active{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr auto;}

/* Header */
.room-header{
  grid-column:1/-1;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 20px;
}
.room-name-wrap{display:flex;align-items:center;gap:10px;}
.room-hash{font-family:'JetBrains Mono',monospace;color:var(--accent2);font-size:1rem;}
.room-title{font-weight:600;font-size:.95rem;}
.live-dot{width:8px;height:8px;background:var(--accent2);border-radius:50%;animation:pulse 1.6s ease-in-out infinite;flex-shrink:0;}
.room-count{font-size:.75rem;color:var(--text-dim);background:var(--card);border:1px solid var(--border);padding:3px 10px;border-radius:20px;}

/* Participants sidebar */
#sidebar{
  grid-column:1;grid-row:2;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
}
#sidebar::-webkit-scrollbar{width:3px;}
#sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.sidebar-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px;}

.user-card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;display:flex;align-items:center;gap:10px;
  transition:border-color .25s,box-shadow .25s;animation:cardIn .3s ease both;
}
.user-card.speaking{border-color:var(--speaking);box-shadow:0 0 0 2px rgba(0,229,176,.12);}
.user-card.me{border-color:var(--accent);}
.avatar{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.95rem;flex-shrink:0;position:relative;
}
.avatar-ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;transition:border-color .25s;}
.user-card.speaking .avatar-ring{border-color:var(--speaking);animation:ringPulse 1s ease-in-out infinite;}
.user-info{flex:1;min-width:0;}
.user-name{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-status{font-size:.68rem;color:var(--text-dim);margin-top:1px;}
.user-status.muted{color:var(--danger);}
.waveform{display:flex;align-items:center;gap:2px;height:14px;flex-shrink:0;}
.wave-bar{width:2px;background:var(--speaking);border-radius:2px;height:3px;transition:height .1s;}
.user-card.speaking .wave-bar:nth-child(1){animation:wave .8s ease-in-out infinite;}
.user-card.speaking .wave-bar:nth-child(2){animation:wave .8s ease-in-out .1s infinite;}
.user-card.speaking .wave-bar:nth-child(3){animation:wave .8s ease-in-out .2s infinite;}
.user-card.speaking .wave-bar:nth-child(4){animation:wave .8s ease-in-out .15s infinite;}
.user-card.speaking .wave-bar:nth-child(5){animation:wave .8s ease-in-out .05s infinite;}

/* ══ CHAT PANEL ══ */
#chat-panel{
  grid-column:2;grid-row:2;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:hidden;
}
#chat-panel-header{
  padding:12px 16px;border-bottom:1px solid var(--border);
  font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;
}
#messages{
  flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
}
#messages::-webkit-scrollbar{width:4px;}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* Message bulle */
.msg{display:flex;flex-direction:column;gap:3px;max-width:85%;}
.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.other{align-self:flex-start;}
.msg.system{align-self:center;max-width:100%;}

.msg-meta{font-size:.68rem;color:var(--muted);display:flex;gap:6px;align-items:center;}
.msg-author{font-weight:600;}
.msg.me .msg-author{color:var(--accent);}
.msg.other .msg-author{color:var(--accent2);}

.msg-bubble{
  padding:8px 12px;border-radius:12px;font-size:.86rem;line-height:1.5;word-break:break-word;
}
.msg.me    .msg-bubble{background:rgba(79,140,255,.18);border:1px solid rgba(79,140,255,.25);border-bottom-right-radius:4px;}
.msg.other .msg-bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg.system .msg-bubble{
  background:transparent;border:none;color:var(--muted);font-size:.75rem;
  font-style:italic;text-align:center;padding:2px 8px;
}

/* Fichier dans le chat */
.file-bubble{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;transition:border-color .2s,background .2s;
  text-decoration:none;color:var(--text);
}
.file-bubble:hover{border-color:var(--accent);background:rgba(79,140,255,.08);}
.file-icon{font-size:1.4rem;flex-shrink:0;}
.file-info{min-width:0;}
.file-name{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
.file-size{font-size:.7rem;color:var(--text-dim);margin-top:2px;}
.file-dl{font-size:.7rem;color:var(--accent);margin-top:2px;}

/* Image dans le chat */
.img-preview{
  max-width:220px;max-height:180px;border-radius:10px;border:1px solid var(--border);
  display:block;cursor:pointer;transition:opacity .2s;
}
.img-preview:hover{opacity:.85;}

/* Zone de saisie */
#chat-input-area{
  padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;
}
#chat-input{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:.88rem;
  outline:none;resize:none;max-height:120px;min-height:40px;transition:border-color .2s;
  line-height:1.4;
}
#chat-input:focus{border-color:var(--accent);}
#chat-input::placeholder{color:var(--muted);}

.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text-dim);font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(79,140,255,.1);}
.icon-btn.send{background:var(--accent);border-color:var(--accent);color:#fff;}
.icon-btn.send:hover{filter:brightness(1.1);}

#file-input{display:none;}

/* ══ CONTROLS ══ */
.controls{
  grid-column:1/-1;
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
}
.ctrl-btn{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:1.1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.ctrl-btn:hover{background:var(--border);transform:scale(1.05);}
.ctrl-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.ctrl-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.ctrl-btn.danger:hover{filter:brightness(1.1);}
.status-text{font-size:.78rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}

/* ══ LIGHTBOX IMAGE ══ */
#lightbox{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.85);align-items:center;justify-content:center;cursor:zoom-out;
}
#lightbox.open{display:flex;}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:12px;box-shadow:0 0 60px rgba(0,0,0,.8);}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--card);border:1px solid var(--border);
  padding:9px 18px;border-radius:50px;font-size:.82rem;color:var(--text-dim);
  transition:transform .3s ease;z-index:999;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ══ RESPONSIVE ══ */
@media(max-width:680px){
  #room-screen.active{
    grid-template-columns:1fr;
    grid-template-rows:auto auto 1fr auto;
  }
  #sidebar{grid-column:1;grid-row:2;max-height:160px;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;}
  .user-card{flex-direction:column;text-align:center;min-width:100px;padding:8px;}
  #chat-panel{grid-column:1;grid-row:3;}
  .controls{grid-column:1;grid-row:4;}
}

/* ══ ANIMATIONS ══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes cardIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes wave{0%,100%{height:3px;}50%{height:14px;}}
@keyframes ringPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
</style>
</head>
<body>

<!-- ══ JOIN SCREEN ══ -->
<div id="join-screen">
  <div class="logo">
    <div class="logo-icon">🎙️</div>
    <h1>VoxRoom</h1>
    <p>Salon vocal • Chat • Fichiers</p>
  </div>
  <div class="form-card">
    <div class="field">
      <label>Ton pseudo</label>
      <input id="input-username" type="text" placeholder="ex : Alice" maxlength="20" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Nom du salon</label>
      <input id="input-room" type="text" placeholder="ex : general" maxlength="20" autocomplete="off"/>
    </div>
    <button class="btn btn-primary" id="join-btn" onclick="joinRoom()">Rejoindre le salon</button>
  </div>
</div>

<!-- ══ ROOM SCREEN ══ -->
<div id="room-screen">

  <div class="room-header">
    <div class="room-name-wrap">
      <span class="room-hash">#</span>
      <span class="room-title" id="room-label">general</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="live-dot"></div>
      <span class="room-count" id="room-count">0 connecté(s)</span>
    </div>
  </div>

  <!-- Sidebar participants -->
  <div id="sidebar">
    <div class="sidebar-title">🎙 Voix</div>
    <div id="participants"></div>
  </div>

  <!-- Chat -->
  <div id="chat-panel">
    <div id="chat-panel-header">💬 Chat du salon</div>
    <div id="messages"></div>
    <div id="chat-input-area">
      <input type="file" id="file-input" onchange="sendFile(this)"/>
      <button class="icon-btn" title="Envoyer un fichier" onclick="document.getElementById('file-input').click()">📎</button>
      <textarea id="chat-input" placeholder="Écrire un message…" rows="1"
        oninput="autoResize(this)" onkeydown="msgKeydown(event)"></textarea>
      <button class="icon-btn send" title="Envoyer" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Contrôles voix -->
  <div class="controls">
    <button class="ctrl-btn" id="mute-btn" title="Muet / Actif" onclick="toggleMute()">🎙️</button>
    <span class="status-text" id="status-label">connecté</span>
    <button class="ctrl-btn danger" title="Quitter" onclick="leaveRoom()">📴</button>
  </div>

</div>

<!-- Lightbox image -->
<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src="" alt=""/></div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ══ CONFIG ══ */
const ICE_SERVERS={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

/* ══ ÉTAT ══ */
let socket,localStream;
let myId=null,myUsername='',myRoom='';
let isMuted=false;
let peers={};
let users={};
let audioCtx;

/* ══ JOIN ══ */
async function joinRoom(){
  const username=document.getElementById('input-username').value.trim();
  const room=document.getElementById('input-room').value.trim()||'general';
  if(!username){showToast('Entre ton pseudo !');return;}
  const btn=document.getElementById('join-btn');
  btn.disabled=true;btn.textContent='Connexion micro…';
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  }catch(e){
    showToast('❌ Accès micro refusé');
    btn.disabled=false;btn.textContent='Rejoindre le salon';return;
  }
  myUsername=username;myRoom=room;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  detectSpeaking(localStream,'me');
  socket=io();
  setupSocket();
  socket.emit('join-room',{roomId:room,username});
}

/* ══ SOCKET ══ */
function setupSocket(){
  socket.on('connect',()=>{myId=socket.id;showRoomScreen();});

  socket.on('existing-peers',async(list)=>{
    for(const p of list){users[p.id]={username:p.username,muted:false};await createOffer(p.id);}
  });
  socket.on('peer-joined',({id,username})=>{users[id]={username,muted:false};});
  socket.on('offer',async({from,username,offer})=>{
    if(!users[from])users[from]={username,muted:false};
    const pc=getOrCreatePC(from);
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const ans=await pc.createAnswer();
    await pc.setLocalDescription(ans);
    socket.emit('answer',{to:from,answer:ans});
  });
  socket.on('answer',async({from,answer})=>{
    const pc=peers[from];if(pc)await pc.setRemoteDescription(new RTCSessionDescription(answer));
  });
  socket.on('ice-candidate',async({from,candidate})=>{
    const pc=peers[from];
    if(pc&&candidate){try{await pc.addIceCandidate(new RTCIceCandidate(candidate));}catch(e){}}
  });
  socket.on('peer-left',({id})=>{closePeer(id);delete users[id];renderUsers();});
  socket.on('peer-mute',({id,muted})=>{if(users[id])users[id].muted=muted;renderUsers();});
  socket.on('room-update',(list)=>{
    document.getElementById('room-count').textContent=list.length+' connecté(s)';
    renderUsers();
  });

  /* Chat */
  socket.on('chat-message',({id,username,text,ts})=>{
    appendMessage({type:'text',from:id,username,text,ts,isMe:id===myId});
  });
  socket.on('file-share',(data)=>{
    appendMessage({type:'file',...data,isMe:data.id===myId});
  });
  socket.on('chat-system',({text})=>{
    appendMessage({type:'system',text});
  });
}

/* ══ WebRTC ══ */
function getOrCreatePC(peerId){
  if(peers[peerId])return peers[peerId];
  const pc=new RTCPeerConnection(ICE_SERVERS);
  peers[peerId]=pc;
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=({candidate})=>{if(candidate)socket.emit('ice-candidate',{to:peerId,candidate});};
  pc.ontrack=({streams})=>{
    let a=document.getElementById('audio-'+peerId);
    if(!a){a=document.createElement('audio');a.id='audio-'+peerId;a.autoplay=true;document.body.appendChild(a);}
    a.srcObject=streams[0];
    detectSpeaking(streams[0],peerId);
  };
  pc.onconnectionstatechange=()=>{
    if(['disconnected','failed','closed'].includes(pc.connectionState))closePeer(peerId);
  };
  return pc;
}
async function createOffer(peerId){
  const pc=getOrCreatePC(peerId);
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('offer',{to:peerId,offer});
}
function closePeer(id){
  if(peers[id]){peers[id].close();delete peers[id];}
  const a=document.getElementById('audio-'+id);if(a)a.remove();
  const c=document.getElementById('card-'+id);if(c)c.remove();
}

/* ══ DÉTECTION PAROLE ══ */
function detectSpeaking(stream,id){
  if(!audioCtx)return;
  try{
    const src=audioCtx.createMediaStreamSource(stream);
    const an=audioCtx.createAnalyser();an.fftSize=512;
    src.connect(an);
    const data=new Uint8Array(an.frequencyBinCount);
    (function check(){
      an.getByteFrequencyData(data);
      const avg=data.reduce((a,b)=>a+b,0)/data.length;
      const card=document.getElementById('card-'+id);
      if(card)card.classList.toggle('speaking',avg>8&&!(id==='me'&&isMuted));
      requestAnimationFrame(check);
    })();
  }catch(e){}
}

/* ══ CONTRÔLES ══ */
function toggleMute(){
  isMuted=!isMuted;
  localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);
  const btn=document.getElementById('mute-btn');
  btn.textContent=isMuted?'🔇':'🎙️';
  btn.classList.toggle('active',isMuted);
  document.getElementById('status-label').textContent=isMuted?'en sourdine':'connecté';
  if(socket)socket.emit('mute-state',{muted:isMuted});
  renderUsers();
}

function leaveRoom(){
  if(socket)socket.disconnect();
  Object.keys(peers).forEach(closePeer);
  if(localStream)localStream.getTracks().forEach(t=>t.stop());
  document.querySelectorAll('audio').forEach(a=>a.remove());
  peers={};users={};myId=null;isMuted=false;
  document.getElementById('room-screen').classList.remove('active');
  document.getElementById('join-screen').style.display='';
  document.getElementById('participants').innerHTML='';
  document.getElementById('messages').innerHTML='';
  document.getElementById('join-btn').disabled=false;
  document.getElementById('join-btn').textContent='Rejoindre le salon';
  document.getElementById('mute-btn').textContent='🎙️';
}

/* ══ CHAT — ENVOYER TEXTE ══ */
function sendMessage(){
  const ta=document.getElementById('chat-input');
  const text=ta.value.trim();
  if(!text||!socket)return;
  socket.emit('chat-message',{text});
  ta.value='';ta.style.height='';
}
function msgKeydown(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
}
function autoResize(el){
  el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';
}

/* ══ CHAT — ENVOYER FICHIER ══ */
function sendFile(input){
  const file=input.files[0];if(!file)return;
  const MAX=8*1024*1024;
  if(file.size>MAX){showToast('❌ Fichier trop volumineux (max 8 Mo)');input.value='';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    socket.emit('file-share',{name:file.name,type:file.type,size:file.size,data:e.target.result});
  };
  reader.readAsDataURL(file);
  input.value='';
}

/* ══ CHAT — AFFICHER MESSAGES ══ */
function appendMessage({type,from,username,text,data,name,size,isMe,ts}){
  const box=document.getElementById('messages');
  const div=document.createElement('div');

  if(type==='system'){
    div.className='msg system';
    div.innerHTML=`<div class="msg-bubble">${escHtml(text)}</div>`;
  } else {
    div.className='msg '+(isMe?'me':'other');
    const time=ts?new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
    let content='';
    if(type==='text'){
      content=`<div class="msg-bubble">${escHtml(text).replace(/\n/g,'<br>')}</div>`;
    } else {
      // fichier
      const isImg=data&&/^image\//.test(name?mimeOf(name):'');
      if(isImg){
        content=`
          <img class="img-preview" src="${data}" alt="${escHtml(name)}"
               onclick="openLightbox('${data}')" title="Cliquer pour agrandir"/>
          <div class="msg-meta" style="margin-top:4px"><span>${escHtml(name)}</span><span>${fmtSize(size)}</span></div>`;
      } else {
        const icon=fileIcon(name||'');
        content=`<a class="file-bubble" href="${data}" download="${escHtml(name||'fichier')}">
          <span class="file-icon">${icon}</span>
          <div class="file-info">
            <div class="file-name">${escHtml(name||'fichier')}</div>
            <div class="file-size">${fmtSize(size)}</div>
            <div class="file-dl">⬇ Télécharger</div>
          </div>
        </a>`;
      }
    }
    div.innerHTML=`
      <div class="msg-meta">
        <span class="msg-author">${escHtml(isMe?'Moi':username)}</span>
        <span>${time}</span>
      </div>
      ${content}`;
  }
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

/* ══ RENDU PARTICIPANTS ══ */
function showRoomScreen(){
  document.getElementById('join-screen').style.display='none';
  document.getElementById('room-screen').classList.add('active');
  document.getElementById('room-label').textContent=myRoom;
  renderUsers();
  document.getElementById('chat-input').focus();
}

function renderUsers(){
  const container=document.getElementById('participants');
  let myCard=document.getElementById('card-me');
  if(!myCard){myCard=createCard('me',myUsername,true);container.prepend(myCard);}
  updateStatus(myCard,isMuted);
  const present=new Set(['me']);
  Object.entries(users).forEach(([id,info])=>{
    present.add(id);
    let card=document.getElementById('card-'+id);
    if(!card){card=createCard(id,info.username,false);container.appendChild(card);}
    updateStatus(card,info.muted);
  });
  container.querySelectorAll('.user-card').forEach(c=>{
    if(!present.has(c.id.replace('card-','')))c.remove();
  });
}

function createCard(id,username,isMe){
  const colors=['#4f8cff','#00e5b0','#f59e0b','#ec4899','#8b5cf6','#ef4444','#14b8a6'];
  const color=colors[Math.abs(hashStr(username))%colors.length];
  const div=document.createElement('div');
  div.id='card-'+id;
  div.className='user-card'+(isMe?' me':'');
  div.innerHTML=`
    <div class="avatar" style="background:${color}22;color:${color}">
      <div class="avatar-ring"></div>${username.charAt(0).toUpperCase()}
    </div>
    <div class="user-info">
      <div class="user-name">${escHtml(username)}</div>
      <div class="user-status" id="status-${id}">${isMe?'moi':''}</div>
    </div>
    <div class="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>`;
  return div;
}

function updateStatus(card,muted){
  const id=card.id.replace('card-','');
  const el=document.getElementById('status-'+id);
  if(!el)return;
  const isMe=id==='me';
  if(muted){el.className='user-status muted';el.textContent='🔇 muet';}
  else{el.className='user-status';el.textContent=isMe?'moi':'';}
}

/* ══ LIGHTBOX ══ */
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}

/* ══ UTILS ══ */
let toastT;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h;}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtSize(b){if(!b)return'';if(b<1024)return b+'o';if(b<1048576)return(b/1024).toFixed(1)+' Ko';return(b/1048576).toFixed(1)+' Mo';}
function mimeOf(n){const ext=n.split('.').pop().toLowerCase();const m={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml'};return m[ext]||'';}
function fileIcon(n){const ext=n.split('.').pop().toLowerCase();const m={pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',ppt:'📊',pptx:'📊',zip:'🗜',rar:'🗜','7z':'🗜',mp3:'🎵',wav:'🎵',mp4:'🎬',mov:'🎬',png:'🖼',jpg:'🖼',jpeg:'🖼',gif:'🖼',txt:'📋',js:'💻',py:'💻',java:'💻',html:'💻',css:'💻'};return m[ext]||'📎';}

/* Entrée → rejoindre depuis join screen */
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('join-screen').style.display!=='none')joinRoom();
});
</script>
